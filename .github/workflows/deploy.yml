name: Deploy to GitHub Pages

# Publishes the static build to https://baohuytran.github.io/duohuygo-xiangqi/ on every push to main.
# One-time repo setup: Settings → Pages → Source: "GitHub Actions". For account login + sync, set
# VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY as Variables (or Secrets) on the `github-pages`
# environment or at repository level. The single job below runs inside that environment, so both
# places are visible to the build. Without them the app builds without the account feature and the
# run shows a warning.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment that is already running; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Public client values (the publishable/anon key is meant to ship to browsers; Row Level Security
      # protects the data). Environment values override repository ones; Variables are preferred.
      - name: Check Supabase settings
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            echo "Supabase is configured: this build includes account login and sync."
          else
            echo "::warning title=Account login and sync are disabled::VITE_SUPABASE_URL and/or VITE_SUPABASE_ANON_KEY are not set (github-pages environment or repository → Secrets and variables → Actions). Add both, then re-run this workflow."
          fi

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
