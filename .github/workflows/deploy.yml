name: Deploy to GitHub Pages

# Publishes the static build to https://baohuytran.github.io/duohuygo-xiangqi/ on every push to main.
# One-time repo setup: Settings → Pages → Source: "GitHub Actions", and (optional, for account
# login + sync) Settings → Secrets and variables → Actions → Variables (or Secrets), at REPOSITORY level:
# VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY. Without them the app builds without the account feature
# and the run shows a warning. Values set only on the github-pages environment are not visible to the build.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never cancel a deployment that is already running; queue the next one instead.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Public client values (the publishable/anon key is meant to ship to browsers; Row Level Security
      # protects the data). Read from repository Variables, or from repository Secrets if they were saved there.
      - name: Check Supabase settings
        env:
          SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_KEY" ]; then
            echo "Supabase is configured: this build includes account login and sync."
          else
            echo "::warning title=Account login and sync are disabled::VITE_SUPABASE_URL and/or VITE_SUPABASE_ANON_KEY are not set at repository level (Settings → Secrets and variables → Actions → Variables or Secrets). Add both, then re-run this workflow."
          fi

      - name: Build
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY || secrets.VITE_SUPABASE_ANON_KEY }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
